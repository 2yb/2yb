<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Varun Saxena — Full-Stack Product Engineer</title>
  <desc id="description">A dark neon profile banner for Varun, focused on full-stack engineering, end-to-end system design, and technical leadership.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.55" stop-color="#11152b"/>
      <stop offset="1" stop-color="#17102a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="980" cy="170" r="250" fill="url(#glow)">
    <animate attributeName="cx" values="940;1030;940" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;210;150" dur="17s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="290" r="4" fill="#67e8f9" filter="url(#soft-glow)">
    <animate attributeName="cy" values="290;80;290" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="100" r="3" fill="#c4b5fd" filter="url(#soft-glow)">
    <animate attributeName="cx" values="1010;1140;1010" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <path d="M650 360C780 300 790 210 920 205s185 57 280-20" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.45" stroke-dasharray="10 13" filter="url(#soft-glow)">
    <animate attributeName="stroke-dashoffset" values="0;-92" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M0 310C190 245 280 350 470 285s260-36 350-100" fill="none" stroke="url(#neon)" stroke-width="1" opacity="0.2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="76" y="82" width="8" height="148" rx="4" fill="url(#neon)"/>
    <text x="112" y="145" fill="#f8fafc" font-size="54" font-weight="750" letter-spacing="2">VARUN SAXENA</text>
    <text x="116" y="190" fill="#cbd5e1" font-size="21" font-weight="600" letter-spacing="2">FULL-STACK PRODUCT ENGINEER</text>
    <text x="116" y="232" fill="#94a3b8" font-size="18">End-to-end system design · AI products · technical leadership</text>
    <text x="116" y="286" fill="url(#neon)" font-size="15" font-weight="650" letter-spacing="3">DESIGN MINDFULLY / BUILD USEFULLY / LEAD WITH CLARITY</text>
  </g>

  <g fill="none" stroke="url(#neon)" opacity="0.72">
    <circle cx="1030" cy="180" r="78" stroke-width="1.5"/>
    <ellipse cx="1030" cy="180" rx="112" ry="42" stroke-width="1.2" transform="rotate(-32 1030 180)"/>
    <circle cx="1095" cy="124" r="5" fill="#67e8f9" stroke="none" filter="url(#soft-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 1030 180" to="360 1030 180" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
